<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>EduAid - Welcome</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

  <style>
    body {
      background: linear-gradient(-45deg, #e3f2fd, #e8f5e9, #f0f4c3, #fff3e0);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .card {
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
      border-radius: 16px;
    }

    .nav-tabs .nav-link.active {
      background-color: #4CAF50;
      color: white !important;
      font-weight: 600;
      border-radius: 0;
    }

    .nav-tabs .nav-link {
      color: #4CAF50;
      font-weight: 500;
    }

    .tab-content {
      padding-top: 20px;
    }

    .btn-eduaid {
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      transition: background-color 0.3s ease;
    }

    .btn-eduaid:hover {
      background-color: #388e3c;
    }

    label {
      font-weight: 500;
      color: #2e7d32;
    }

    h2 {
      font-weight: bold;
      font-size: calc(1.5rem + 1vw);
    }

    footer {
      margin-top: 60px;
      padding: 20px 0;
      font-size: 0.9rem;
      color: #666;
      border-top: 1px solid #ccc;
      background-color: rgba(255, 255, 255, 0.2);
    }
    @keyframes slideInRight {
  0% {
    transform: translateX(100%);
    opacity: 0;
  }
  100% {
    transform: translateX(0);
    opacity: 1;
  }
}
/* Welcome banner styling */
.ticker-wrapper {
  overflow: hidden;
  width: 100%;
  border-bottom: 2px solid #4CAF50;
  background-color: #ffffffcc;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
}

.ticker-content {
  display: inline-block;
  white-space: nowrap;
  padding-left: 100%;
  animation: scroll-left 15s linear infinite;
}

@keyframes scroll-left {
  0% {
    transform: translateX(0%);
  }
  100% {
    transform: translateX(-100%);
  }
}

  </style>
</head>
<body>

<div class="container py-5">
  <!-- Animated Welcome Banner -->
<div class="ticker-wrapper bg-light py-2 mb-3">
  <div class="ticker-content">
    <h2 class="m-0 text-success fw-bold">🎓 Welcome to <strong>EduAid</strong> — Empowering Futures Through Education</h2>
  </div>
</div>
      <!-- Tabs -->
    <div class="card mx-auto p-3" style="max-width: 500px;">
      <ul class="nav nav-tabs justify-content-center" id="authTabs" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active" id="user-login-tab" data-bs-toggle="tab" data-bs-target="#user-login" type="button" title="Login to your account">User Login</button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="user-register-tab" data-bs-toggle="tab" data-bs-target="#user-register" type="button" title="Register new user">Register</button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="admin-login-tab" data-bs-toggle="tab" data-bs-target="#admin-login" type="button" title="Admin access">Admin Login</button>
        </li>
      </ul>

      <!-- Tab Contents -->
      <div class="tab-content" id="authTabsContent">

        <!-- User Login -->
        <div class="tab-pane fade show active" id="user-login">
          <form id="userLoginForm" action="/api/login" method="POST">
            <div class="input-group mb-3">
              <span class="input-group-text bg-white text-success"><i class="bi bi-envelope-fill"></i></span>
              <input id="email" type="email" name="email" class="form-control" placeholder="Email" required>
            </div>
            <div class="input-group mb-3">
              <span class="input-group-text bg-white text-success"><i class="bi bi-lock-fill"></i></span>
              <input id="password" type="password" name="password" class="form-control" placeholder="Password" required>
            </div>
            <button class="btn btn-eduaid w-100">Login as User</button>
          </form>
        </div>

        <!-- User Register -->
        <div class="tab-pane fade" id="user-register">
          <form action="/api/register" method="POST">
            <div class="input-group mb-3">
              <span class="input-group-text bg-white text-success"><i class="bi bi-person-fill"></i></span>
              <input type="text" name="name" class="form-control" placeholder="Full Name" required>
            </div>
            <div class="input-group mb-3">
              <span class="input-group-text bg-white text-success"><i class="bi bi-envelope-fill"></i></span>
              <input type="email" name="email" class="form-control" placeholder="Email" required>
            </div>
            <div class="input-group mb-3">
              <span class="input-group-text bg-white text-success"><i class="bi bi-lock-fill"></i></span>
              <input type="password" name="password" class="form-control" placeholder="Password" required>
            </div>
            <button class="btn btn-eduaid w-100">Register</button>
          </form>
        </div>

        <!-- Admin Login -->
        <div class="tab-pane fade" id="admin-login">
          <form action="/admin-login" method="POST">
            <div class="input-group mb-3">
              <span class="input-group-text bg-white text-success"><i class="bi bi-person-badge-fill"></i></span>
              <input type="text" name="username" class="form-control" placeholder="Admin Username" required>
            </div>
            <div class="input-group mb-3">
              <span class="input-group-text bg-white text-success"><i class="bi bi-lock-fill"></i></span>
              <input type="password" name="password" class="form-control" placeholder="Password" required>
            </div>
            <button class="btn btn-eduaid w-100">Login as Admin</button>
          </form>
        </div>

      </div>
    </div>
  </div>
</div>
<!-- Footer -->
<footer class="text-center">
  <p>&copy; 2025 EduAid — Empowering Dreams Through Education 🌱</p>
</footer>

<!-- JS -->
<script>
  document.getElementById("userLoginForm").addEventListener("submit", async function (e) {
    e.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const formData = new URLSearchParams();
    formData.append("email", email);
    formData.append("password", password);

    try {
      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: formData
      });

      if (!res.ok) {
        const errorText = await res.text();
        alert("Login failed: " + errorText);
        return;
      }

      const data = await res.json();
      localStorage.setItem("token", data.token);
      localStorage.setItem("username", data.name);

      // Redirect to homepage
      window.location.href = "/index3.html";
    } catch (error) {
      alert("Error logging in.");
      console.error(error);
    }
  });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
